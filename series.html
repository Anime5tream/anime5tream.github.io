<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Series Details · AnimeStream</title>
  <meta name="description" content="Detalles, episodios y sinopsis del anime en AnimeStream. Una pagina para ver anime sin anuncios :D" />

  <meta property="og:title" content="Series Details · AnimeStream" />
  <meta property="og:description" content="Detalles, episodios y sinopsis del anime en AnimeStream." />
  <meta property="og:image" content="https://i.imgur.com/ZkZavVo.png" />
  <meta property="og:url" content="https://anime5tream.github.io/series.html" />
  <meta property="og:type" content="video.tv_show" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Series Details · AnimeStream" />
  <meta name="twitter:description" content="Detalles, episodios y sinopsis del anime en AnimeStream." />
  <meta name="twitter:image" content="https://i.imgur.com/ZkZavVo.png" />

  <link rel="icon" type="image/png" href="https://i.imgur.com/ZkZavVo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="src/css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">

  <header id="cr-header" class="sticky top-0 z-40"></header>

  <main id="series-page" class="flex-1 pb-12">
    <div class="w-full h-[460px] md:h-[520px] skeleton"></div>
  </main>
  <div id="mobile-sticky-watch-bar" class="hidden md:hidden fixed bottom-[58px] inset-x-0 z-30 bg-[#0B0C0F]/95 backdrop-blur border-t border-[#2B2E36] px-4 py-2.5 flex items-center gap-2.5 shadow-2xl">
    <a id="sticky-watch-link" href="#" class="flex-1 bg-brand text-black font-black text-xs uppercase py-3 px-4 flex items-center justify-center gap-2 tracking-wider">
      <i data-lucide="play" class="w-4 h-4 fill-current"></i>
      <span id="sticky-watch-text">START WATCHING E1</span>
    </a>
    <button id="sticky-bookmark-btn" class="w-11 h-11 shrink-0 border-2 border-brand text-brand flex items-center justify-center bg-black/50">
      <i data-lucide="bookmark" class="w-5 h-5"></i>
    </button>
  </div>

  <script src="src/lib/adapters.js"></script>
  <script src="src/lib/api.js"></script>
  <script src="src/lib/store.js"></script>
  <script>
    const { Api, Adapters, Store, initSharedLayout } = window;
    initSharedLayout();

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug') || 'sword-art-online';

    async function renderSeriesPage() {
      const anime = await Api.getAnimeDetails(slug);
      document.title = `${anime.title} - Watch on Anime5tream`;

      const inWatchlist = Store.isInWatchlist(anime.slug);
      const history = Store.getHistory().filter(h => h.slug === anime.slug);
      const hasWatchedBefore = history.length > 0;
      const startEp = hasWatchedBefore ? history[0].episodeNumber : 1;
      const watchBtnText = hasWatchedBefore
        ? `${Store.t('continueWatching').toUpperCase()} E${startEp}`
        : `${Store.t('startWatching')} E1`;

      const dynamicStarsMobile = Adapters.renderStarsHTML(anime.rating, 'w-5 h-5');
      const dynamicStarsDesktop = Adapters.renderStarsHTML(anime.rating, 'w-4 h-4');
      const heroBgImg = anime.bannerHD || anime.cover;
      const pageEl = document.getElementById('series-page');

      pageEl.innerHTML = `
        <section class="relative w-full min-h-[520px] md:min-h-[540px] bg-[#000000] overflow-hidden flex items-end">
          <!-- En Teléfono (< 768px): Arte Vertical a todo lo ancho -->
          <div class="md:hidden absolute inset-x-0 top-0 h-[430px] overflow-hidden">
            <img src="${anime.cover}" alt="${anime.title}" class="w-full h-full object-cover object-top" />
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/55 to-transparent"></div>
          </div>

          <!-- En PC (md+): Imagen 16:9 Panorámica HD (1280x720 / 1920x1080) -->
          <div class="hidden md:block absolute inset-y-0 right-0 w-full lg:w-[76%] h-full overflow-hidden">
            <img src="${heroBgImg}" alt="${anime.title}" class="animate-hero-bg w-full h-full object-cover object-center opacity-90" />
          </div>
          <div class="hidden md:block cr-hero-mask absolute inset-0"></div>

          <div class="relative z-10 max-w-[1440px] w-full mx-auto px-4 sm:px-6 md:px-12 pb-4 md:pb-8 pt-[265px] md:pt-28">
            <div class="animate-hero-content max-w-xl space-y-3 text-center md:text-left mx-auto md:mx-0">
              <h1 class="text-2xl sm:text-3xl md:text-5xl font-black tracking-tight text-white drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] leading-tight">
                ${anime.title}
              </h1>

              <!-- 14+ ♦ Sub | Dub ♦ Géneros -->
              <div class="flex flex-wrap items-center justify-center md:justify-start gap-1.5 text-xs text-[#DADADA] font-semibold pt-1">
                <span class="px-1.5 py-0.5 bg-[#23252B] text-white font-bold">${anime.mature ? '14+' : 'PG-13'}</span>
                <span class="text-[9px] text-[#A0A0A0]">♦</span>
                <span>Sub | Dub</span>
                <span class="text-[9px] text-[#A0A0A0]">♦</span>
                <span>${anime.genres.slice(0, 3).join(', ')}</span>
              </div>

              <!-- Estrellas en Teléfono -->
              <div class="md:hidden flex items-center justify-center gap-3 pt-1">
                <div class="flex items-center gap-1.5">
                  ${dynamicStarsMobile}
                </div>
                <span class="text-[#3E4149]">|</span>
                <div class="flex items-center gap-1 text-xs font-bold text-white">
                  <span>${anime.rating} (${anime.votes})</span>
                </div>
              </div>

              <!-- Estrellas en PC -->
              <div class="hidden md:flex items-center gap-3 pt-1">
                <div class="flex items-center gap-1">
                  ${dynamicStarsDesktop}
                </div>
                <span class="text-xs font-bold text-[#DADADA]">
                  Average Rating: <strong class="text-white">${anime.rating} (${anime.votes})</strong>
                </span>
              </div>

              <!-- Fila Principal de Botones: [▶ START WATCHING E1] [Bookmark] [Share] -->
              <div id="main-hero-cta" class="flex items-center justify-center md:justify-start gap-2.5 sm:gap-3 pt-2">
                <a href="watch.html?slug=${encodeURIComponent(anime.slug)}&ep=${startEp}" class="cr-btn-interactive flex-1 sm:flex-initial justify-center bg-brand text-black font-black text-xs md:text-sm uppercase px-5 py-3.5 sm:py-3 flex items-center gap-2 tracking-wider">
                  <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                  <span>${watchBtnText}</span>
                </a>

                <button id="series-bookmark-btn" class="cr-btn-interactive w-12 h-12 sm:w-11 sm:h-11 shrink-0 border-2 border-brand text-brand flex items-center justify-center hover:bg-brand/10" title="Watchlist">
                  <i data-lucide="bookmark" class="w-5 h-5 ${inWatchlist ? 'fill-current' : ''}"></i>
                </button>

                <button id="series-share-btn-desktop" class="hidden md:flex w-10 h-10 shrink-0 text-brand hover:text-white items-center justify-center transition" title="Share">
                  <i data-lucide="share-2" class="w-5 h-5"></i>
                </button>
              </div>

              <!-- En Teléfono: Fila inferior centrada con + MY LIST y SHARE funcionales -->
              <div class="md:hidden flex items-center justify-center gap-12 pt-4 pb-1">
                <button id="series-plus-btn-mobile" class="flex flex-col items-center gap-1 text-brand">
                  <i data-lucide="plus" class="w-6 h-6"></i>
                  <span class="text-[10px] font-black uppercase tracking-wider">${Store.t('myListShort')}</span>
                </button>
                <button id="series-share-btn-mobile" class="flex flex-col items-center gap-1 text-brand">
                  <i data-lucide="share-2" class="w-5 h-5"></i>
                  <span class="text-[10px] font-black uppercase tracking-wider">${Store.t('shareShort')}</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Sinopsis con efecto Fade en Móvil + MORE DETAILS funcional -->
        <section class="max-w-[1440px] mx-auto px-4 sm:px-6 md:px-12 pt-4 md:pt-6 pb-6 md:pb-8 border-b border-[#2B2E36]">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8 text-sm">
            <div class="lg:col-span-7 space-y-2">
              <div id="synopsis-fade-wrapper" class="relative overflow-hidden max-h-[76px] sm:max-h-none transition-all duration-300">
                <p id="series-synopsis-text" class="text-[#DADADA] leading-relaxed font-semibold sm:font-normal">${anime.synopsis}</p>
                <div id="synopsis-gradient-mask" class="sm:hidden absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-black to-transparent pointer-events-none"></div>
              </div>
              <button id="toggle-more-details" class="text-xs font-black uppercase text-brand tracking-wider hover:underline pt-1 block">
                ${Store.t('moreDetails')}
              </button>
            </div>

            <div id="series-audio-meta" class="hidden sm:block lg:col-span-5 space-y-2 text-xs leading-relaxed text-[#A0A0A0]">
              <div>
                <strong class="text-white">Audio:</strong> Japanese, English, Español (América Latina)
              </div>
              <div>
                <strong class="text-white">Subtitles:</strong> Español (América Latina), English, Português (Brasil)
              </div>
              <div>
                <strong class="text-white">Genres:</strong> ${anime.genres.join(', ')}
              </div>
            </div>
          </div>
        </section>

        <!-- Temporada y Lista de Episodios (Sin botones muertos de OPTIONS o PREVIOUS/NEXT SEASON) -->
        <section class="max-w-[1440px] mx-auto px-4 sm:px-6 md:px-12 pt-5 md:pt-6">
          <div class="flex items-center justify-between gap-2 mb-5 md:mb-6">
            <div class="flex items-center gap-2 text-white font-black text-sm sm:text-base uppercase sm:normal-case truncate">
              <span class="truncate">${anime.title} (${anime.episodes.length} ${Store.t('episodes')})</span>
            </div>

            <div class="flex items-center gap-5 sm:gap-6 text-xs font-bold uppercase text-[#DADADA] shrink-0">
              <button id="toggle-order-btn" class="flex items-center gap-1.5 hover:text-brand transition-colors">
                <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
                <span id="order-label">OLDEST</span>
              </button>
            </div>
          </div>

          <div id="episodes-6col-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3.5 sm:gap-4"></div>
        </section>
      `;

      const stickyBar = document.getElementById('mobile-sticky-watch-bar');
      const stickyLink = document.getElementById('sticky-watch-link');
      const stickyText = document.getElementById('sticky-watch-text');
      const stickyBmBtn = document.getElementById('sticky-bookmark-btn');

      stickyLink.href = `watch.html?slug=${encodeURIComponent(anime.slug)}&ep=${startEp}`;
      stickyText.textContent = watchBtnText;
      stickyBmBtn.innerHTML = `<i data-lucide="bookmark" class="w-5 h-5 ${inWatchlist ? 'fill-current' : ''}"></i>`;

      const mainCta = document.getElementById('main-hero-cta');
      window.addEventListener('scroll', () => {
        if (!mainCta || window.innerWidth >= 768) {
          stickyBar.classList.add('hidden');
          return;
        }
        const rect = mainCta.getBoundingClientRect();
        if (rect.bottom < 60) {
          stickyBar.classList.remove('hidden');
        } else {
          stickyBar.classList.add('hidden');
        }
      }, { passive: true });

      let ascending = true;
      const episodes = [...anime.episodes];

      function drawEpisodes() {
        const sorted = ascending
          ? [...episodes].sort((a, b) => a.number - b.number)
          : [...episodes].sort((a, b) => b.number - a.number);

        const grid = document.getElementById('episodes-6col-grid');
        grid.innerHTML = sorted.map((ep, idx) => `
          <a href="watch.html?slug=${encodeURIComponent(anime.slug)}&ep=${ep.number}" class="cr-ep-card animate-card-in flex sm:block gap-3.5 sm:gap-0 sm:h-[225px] py-1 sm:p-0" style="animation-delay: ${Math.min(idx * 25, 300)}ms">
            <!-- Miniatura 16:9 con botón Play circular y duración abajo a la derecha -->
            <div class="relative w-[148px] sm:w-full aspect-video bg-[#141519] overflow-hidden shrink-0">
              <img src="${ep.cover || heroBgImg}" alt="${ep.title}" class="w-full h-full object-cover object-center" />
              <div class="absolute inset-0 flex items-center justify-center bg-black/20">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/60 flex items-center justify-center">
                  <i data-lucide="play" class="w-5 h-5 text-white fill-current ml-0.5"></i>
                </div>
              </div>
              <span class="absolute bottom-1 right-1 sm:bottom-1.5 sm:right-1.5 bg-black/80 text-white text-[11px] font-bold px-1.5 py-0.5">${ep.duration}</span>
            </div>

            <!-- Texto a la derecha en móvil y abajo en PC -->
            <div class="flex-1 flex flex-col justify-between sm:pt-2 sm:pr-1 min-w-0 py-0.5">
              <div>
                <div class="text-[10px] font-bold uppercase text-[#A0A0A0] truncate">${anime.title}</div>
                <div class="text-xs sm:text-xs font-bold text-white mt-0.5 line-clamp-2 sm:line-clamp-1">E${ep.number} – ${ep.title}</div>
              </div>
              <div class="flex items-center justify-between text-xs text-[#A0A0A0] mt-2">
                <span>Sub | Dub</span>
              </div>
            </div>

            <!-- Hover en PC -->
            <div class="cr-ep-hover absolute inset-0 p-3 flex flex-col justify-between z-20">
              <div>
                <div class="text-[10px] font-bold uppercase text-[#A0A0A0] truncate">${anime.title}</div>
                <div class="text-xs font-bold mt-0.5">E${ep.number} – ${ep.title}</div>
                <div class="flex items-center gap-1.5 text-[11px] text-[#A0A0A0] mt-1">
                  <i data-lucide="calendar" class="w-3 h-3"></i>
                  <span>${ep.releaseDate}</span>
                </div>
                <p class="text-[11px] text-[#DADADA] mt-2 line-clamp-4 leading-snug">
                  ${ep.synopsis}
                </p>
              </div>

              <div class="flex items-center justify-between pt-2">
                <span class="flex items-center gap-1.5 text-brand font-black text-xs uppercase">
                  <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                  <span>PLAY E${ep.number}</span>
                </span>
              </div>
            </div>
          </a>
        `).join('');

        if (window.lucide) window.lucide.createIcons();
      }

      drawEpisodes();

      let detailsExpanded = false;
      document.getElementById('toggle-more-details')?.addEventListener('click', (e) => {
        detailsExpanded = !detailsExpanded;
        const wrap = document.getElementById('synopsis-fade-wrapper');
        const mask = document.getElementById('synopsis-gradient-mask');
        const audioMeta = document.getElementById('series-audio-meta');
        if (detailsExpanded) {
          wrap.classList.remove('max-h-[76px]');
          mask?.classList.add('hidden');
          audioMeta?.classList.remove('hidden');
          e.currentTarget.textContent = Store.t('fewerDetails');
        } else {
          wrap.classList.add('max-h-[76px]');
          mask?.classList.remove('hidden');
          audioMeta?.classList.add('hidden');
          e.currentTarget.textContent = Store.t('moreDetails');
        }
      });

      document.getElementById('toggle-order-btn')?.addEventListener('click', () => {
        ascending = !ascending;
        document.getElementById('order-label').textContent = ascending ? 'OLDEST' : 'NEWEST';
        drawEpisodes();
      });

      const handleToggleFav = () => {
        Store.toggleWatchlist(anime);
        renderSeriesPage();
      };

      document.getElementById('series-bookmark-btn')?.addEventListener('click', handleToggleFav);
      document.getElementById('series-plus-btn-mobile')?.addEventListener('click', handleToggleFav);
      stickyBmBtn?.addEventListener('click', handleToggleFav);

      const handleShare = () => {
        navigator.clipboard?.writeText(window.location.href);
        alert('Link copied to clipboard!');
      };

      document.getElementById('series-share-btn-desktop')?.addEventListener('click', handleShare);
      document.getElementById('series-share-btn-mobile')?.addEventListener('click', handleShare);

      if (window.lucide) window.lucide.createIcons();
    }

    renderSeriesPage();
  </script>
</body>
</html>
